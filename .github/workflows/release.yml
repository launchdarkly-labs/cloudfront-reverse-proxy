name: Release

# Publishes a GitHub release, started by hand from the Actions tab (Release > Run workflow) on main:
#
#   1. Move the [Unreleased] entries in CHANGELOG.md under "## [X.Y.Z] - YYYY-MM-DD", update the links
#      at the bottom, set the version in both CloudFormation templates, and merge that to main.
#   2. Run this workflow with the version, X.Y.Z. It creates the vX.Y.Z tag on the main commit it ran on.
#
# In launchdarkly-labs/cloudfront-reverse-proxy only admins can run it. It releases what's already on main,
# so it doesn't run the AWS integration test; run that before merging. It does rerun the offline Terraform
# checks. Its notes are the version's CHANGELOG section, how to deploy that version, and GitHub's list of
# merged pull requests.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.3 (needs a CHANGELOG section and matching templates)
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Admins only in launchdarkly-labs/cloudfront-reverse-proxy
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: .github/scripts/require-admin.sh

      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release from main, not ${GITHUB_REF_NAME}."; exit 1
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, not ${VERSION}."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::v${VERSION} is already tagged. Release a new version."; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG has this version
        run: .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}"

      - name: Templates have this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for f in infrastructure/templates/cloudformation/cloudfront.yaml infrastructure/templates/cloudformation/remove-cloudfront.yaml; do
            if ! grep -q "^  Version: '${VERSION}'$" "$f" || ! grep -q "(v${VERSION})" "$f"; then
              echo "::error file=$f::Set Metadata.Version to '${VERSION}' and the Description's version to (v${VERSION})."; exit 1
            fi
          done

  checks:
    needs: prepare
    uses: ./.github/workflows/terraform.yml

  release:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            .github/scripts/changelog-section.sh "$VERSION"
            cat <<NOTES

          ### Deploy this version

          **CloudFormation:** download \`cloudfront.yaml\` below and create a stack from it, or use the one-click deploy buttons in the README.

          **Terraform:**

          \`\`\`hcl
          module "ld_proxy" {
            source = "github.com/${REPO}//infrastructure/templates/terraform?ref=v${VERSION}"
            # Use a provider in us-east-1; see examples/basic.
          }
          \`\`\`
          NOTES
          } > notes.md
          cat notes.md

      - name: Assets
        env:
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          mkdir dist
          cp infrastructure/templates/cloudformation/cloudfront.yaml infrastructure/templates/cloudformation/remove-cloudfront.yaml dist/
          git archive --format=tar.gz --prefix="ld-cloudfront-proxy-terraform/" \
            -o "dist/ld-cloudfront-proxy-terraform-${TAG}.tar.gz" HEAD:infrastructure/templates/terraform
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      # Creates the tag on the commit this run checked and tested.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: >-
          gh release create "$TAG" dist/*
          --target "$GITHUB_SHA"
          --title "$TAG"
          --notes-file notes.md
          --generate-notes
