name: Terraform integration test

# Deploys the Terraform module to AWS with a custom domain, sends a request through every route, and
# destroys everything (tests/integration). Runs by hand, and before every release.
#
# Setup, in the "integration" GitHub environment:
#   secret   AWS_INTEGRATION_ROLE_ARN  IAM role this environment can assume through GitHub OIDC
#   variable TEST_DOMAIN_NAME          Domain to deploy to, in a public Route 53 hosted zone the role can edit
#   variable LD_CLIENT_SIDE_ID         LaunchDarkly client-side ID to poll flags and send events for

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

# One run at a time: they share the test domain. Never cancel a run, or it can't destroy what it created.
concurrency:
  group: terraform-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: integration
    timeout-minutes: 45

    defaults:
      run:
        working-directory: infrastructure/templates/terraform

    env:
      RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_INTEGRATION_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terraform-integration-${{ github.run_id }}
          # Long enough for the deploy and the destroy, even when CloudFront is slow.
          role-duration-seconds: 7200

      - run: terraform init -input=false -test-directory=tests/integration

      - name: terraform test
        run: >-
          terraform test -no-color -test-directory=tests/integration
          -var "domain_name=${{ vars.TEST_DOMAIN_NAME }}"
          -var "client_side_id=${{ vars.LD_CLIENT_SIDE_ID }}"
          -var "run_id=${RUN_ID}"

      # terraform test destroys what it created even when a check fails. Confirm it, so a failed destroy
      # can't leave a distribution running unnoticed.
      - name: Nothing left behind
        if: always()
        run: |
          # The tagging API can take a minute to drop deleted resources.
          for _ in 1 2 3 4 5 6; do
            left=$(aws resourcegroupstaggingapi get-resources --tag-filters "Key=run-id,Values=${RUN_ID}" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text)
            [ -z "$left" ] && break
            sleep 20
          done
          domain="${{ vars.TEST_DOMAIN_NAME }}"
          parent="${domain#*.}"
          zone=$(aws route53 list-hosted-zones-by-name --dns-name "$parent" \
            --query "HostedZones[?Name=='${parent}.' && Config.PrivateZone==\`false\`].Id | [0]" --output text)
          records=$(aws route53 list-resource-record-sets --hosted-zone-id "$zone" \
            --query "ResourceRecordSets[?ends_with(Name, '${domain}.')].[Name,Type]" --output text)
          if [ -n "$left" ] || [ -n "$records" ]; then
            echo "::error::The integration test left resources behind. Delete them by hand."
            echo "Tagged run-id=${RUN_ID}:"; echo "$left"
            echo "Route 53 records for ${domain}:"; echo "$records"
            exit 1
          fi
          echo "Nothing tagged run-id=${RUN_ID} and no Route 53 records for ${domain} remain."
