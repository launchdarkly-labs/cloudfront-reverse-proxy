name: Terraform checks

# Offline checks for infrastructure/templates/terraform. Nothing here needs AWS credentials; the
# integration test (tests/integration) deploys to AWS and is run by hand.

on:
  pull_request:
    paths:
      - 'infrastructure/templates/terraform/**'
      - 'README.md'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
  # Called by release.yml before publishing.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: infrastructure/templates/terraform

jobs:
  test:
    name: test (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version versions.tf allows, and the newest.
        terraform: ['1.7.0', 'latest']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform test

      - name: Validate examples/basic
        working-directory: infrastructure/templates/terraform/examples/basic
        run: |
          terraform init -input=false -backend=false
          terraform validate

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.60.0

      - name: tflint (with tflint-ruleset-aws)
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1

      # Findings that don't apply are suppressed inline in main.tf, each with its reason.
      - name: Trivy
        run: trivy config --exit-code 1 .

      - name: Docs are up to date
        working-directory: .
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.21.0/terraform-docs-v0.21.0-linux-amd64.tar.gz
          echo "2fdd81b8d21ff1498cd559af0dcc5d155835f84600db06d3923e217124fc735a  terraform-docs.tar.gz" | sha256sum -c
          tar -xzf terraform-docs.tar.gz terraform-docs
          ./terraform-docs infrastructure/templates/terraform
          git diff --exit-code README.md || { echo "::error::README.md is out of date. Run: terraform-docs infrastructure/templates/terraform"; exit 1; }
