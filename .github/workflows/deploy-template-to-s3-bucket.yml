name: Deploy CloudFormation Template to S3

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/templates/cloudfront.yaml'

  workflow_dispatch:

jobs:
  deploy-template:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload CloudFormation templates to S3
        run: |
          echo "Uploading standard template to s3://${{ vars.S3_BUCKET }}/${{ vars.S3_FILE_KEY }}"
          aws s3 cp infrastructure/templates/cloudfront.yaml s3://${{ vars.S3_BUCKET }}/${{ vars.S3_FILE_KEY }}
          
          # Verify uploads
          echo "Verifying template accessibility..."
          curl -f -I https://${{ vars.S3_BUCKET }}.s3.amazonaws.com/${{ vars.S3_FILE_KEY }}
          
          echo "✅ Templates successfully deployed!"
          echo "Standard Template URL: https://${{ vars.S3_BUCKET }}.s3.amazonaws.com/${{ vars.S3_FILE_KEY }}"

      - name: Update deployment status
        run: |
          echo "::notice title=Templates Deployed::CloudFormation templates updated - Standard: https://${{ vars.S3_BUCKET }}.s3.amazonaws.com/${{ vars.S3_FILE_KEY }}"
