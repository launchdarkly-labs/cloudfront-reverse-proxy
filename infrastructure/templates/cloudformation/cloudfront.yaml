AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront proxy for LaunchDarkly with automatic certificate creation and DNS validation (v1.1.0)

Metadata:
  Version: '1.1.0'
  LastUpdated: '2026-10-21'
  Author: 'AWS CloudFront Proxy for LaunchDarkly'

Parameters:
  UseCustomDomain:
    Type: String
    Default: 'false'
    AllowedValues: ['true','false']
    Description: 'true to automatically create certificate and DNS for custom domain, false to use CloudFront default domain'
  DomainName:
    Type: String
    Default: ''
    Description: 'Your custom domain (e.g. flags.example.com) - will auto-create certificate and DNS records'
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_All, PriceClass_200, PriceClass_100]
  EnableLogging:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  LoggingBucket:
    Type: String
    Default: ''
    Description: Optional S3 bucket for logs (name only, no s3://)
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional ARN of a managed policy to set as the permissions boundary of the hosted zone lookup role. Leave empty for none.

Conditions:
  UseCustomDomain: !Equals [!Ref UseCustomDomain, 'true']
  UseLogging: !Equals [!Ref EnableLogging, 'true']
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Resources:
  HostedZoneLookupRole:
    Type: AWS::IAM::Role
    Condition: UseCustomDomain
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Route53Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                Resource: '*'

  HostedZoneLookupFunction:
    Type: AWS::Lambda::Function
    Condition: UseCustomDomain
    Properties:
      FunctionName: !Sub '${AWS::StackName}-hosted-zone-lookup'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt HostedZoneLookupRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  
                  domain_name = event['ResourceProperties']['DomainName'].rstrip('.')
                  r53 = boto3.client('route53')
                  
                  labels = domain_name.split('.')
                  candidates = ['.'.join(labels[i:]) + '.' for i in range(len(labels)-1)]
                  
                  chosen = None
                  paginator = r53.get_paginator('list_hosted_zones')
                  zones = []
                  for page in paginator.paginate():
                      zones.extend(page['HostedZones'])
                  
                  public_zones = [z for z in zones if not z.get('Config', {}).get('PrivateZone', False)]
                  
                  for cand in candidates:
                      for z in public_zones:
                          if z['Name'] == cand:
                              chosen = z
                              break
                      if chosen:
                          break
                  
                  if not chosen:
                      raise Exception(f"No matching PUBLIC hosted zone found for {domain_name} (candidates: {candidates})")
                  
                  zone_id = chosen['Id'].split('/')[-1]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'HostedZoneId': zone_id,
                      'MatchedZoneName': chosen['Name']
                  })
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, str(e))

  HostedZoneLookup:
    Type: AWS::CloudFormation::CustomResource
    Condition: UseCustomDomain
    Properties:
      ServiceToken: !GetAtt HostedZoneLookupFunction.Arn
      DomainName: !Ref DomainName

  # ACM Certificate with automatic DNS validation
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: UseCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !GetAtt HostedZoneLookup.HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-certificate'
    DependsOn: HostedZoneLookup

  # CloudFront Response Headers Policy
  CfResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-LDClientsdkCORS'
        Comment: CORS for LD client SDK proxy
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders: { Items: ['*'] }
          AccessControlAllowMethods: { Items: ['GET','HEAD','POST','OPTIONS'] }
          AccessControlAllowOrigins: { Items: ['*'] }
          # Date is what LaunchDarkly's events endpoint exposes; the browser SDK reads it from event responses.
          AccessControlExposeHeaders: { Items: ['ETag','Cache-Control','Content-Type','Date'] }
          OriginOverride: true

  CfOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-LDClientsdkOriginRequest'
        Comment: Forward all query strings and key preflight headers
        CookiesConfig: { CookieBehavior: "none" }
        HeadersConfig:
          HeaderBehavior: "whitelist"
          Headers:
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers
            - User-Agent
        QueryStringsConfig: { QueryStringBehavior: "all" }

  # CloudFront Cache Policy - Standard
  CfCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-LDClientsdkCache'
        DefaultTTL: 300
        MaxTTL: 600
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: { CookieBehavior: "none" }
          HeadersConfig:
            HeaderBehavior: "whitelist"
            Headers:
              - Origin
              - User-Agent
          QueryStringsConfig:
            QueryStringBehavior: "all"

  CfNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-LDStreamingNoCache'
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        Comment: Minimal cache policy for SSE streaming endpoints
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          CookiesConfig: { CookieBehavior: "none" }
          HeadersConfig: { HeaderBehavior: "none" }
          QueryStringsConfig: { QueryStringBehavior: "all" }

  # pub.observability.app.launchdarkly.com only serves POST /, so its traffic is sent to the
  # proxy under /observability and the prefix is stripped before it reaches the origin.
  CfObservabilityPathRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      # Function names are limited to 64 characters, so use the stack's ID rather than its name.
      Name: !Sub
        - 'ld-observability-${StackUuid}'
        - StackUuid: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
      AutoPublish: true
      FunctionConfig:
        Comment: Strip the /observability prefix for pub.observability.app.launchdarkly.com
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/observability/, '') || '/';
          return request;
        }

  CfDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} - LaunchDarkly client SDK and events proxy'
        Aliases: !If [UseCustomDomain, [!Ref DomainName], []]
        DefaultRootObject: ''
        PriceClass: !Ref PriceClass
        Origins:
          - Id: LDClientSdkOrigin
            DomainName: clientsdk.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
          - Id: LDEventsOrigin
            DomainName: events.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
          - Id: LDSdkOrigin
            DomainName: sdk.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
          - Id: LDClientStreamOrigin
            DomainName: clientstream.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
              # SSE streams are idle between heartbeats; the 30s default drops them. 120s is the max without an AWS quota increase.
              OriginReadTimeout: 120
          - Id: LDAppOrigin
            DomainName: app.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
          - Id: LDObservabilityOtelOrigin
            DomainName: otel.observability.app.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
          - Id: LDObservabilityPubOrigin
            DomainName: pub.observability.app.launchdarkly.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: ['TLSv1.2']
        DefaultCacheBehavior:
          TargetOriginId: LDClientSdkOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: ['GET','HEAD','OPTIONS']
          CachedMethods: ['GET','HEAD','OPTIONS']
          CachePolicyId: !Ref CfCachePolicy
          OriginRequestPolicyId: !Ref CfOriginRequestPolicy
          ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
          Compress: true
        CacheBehaviors:
          # Observability and session replay. Both origins answer CORS themselves (otel echoes the Origin
          # and allows credentials), so no response headers policy overrides them, and every viewer
          # header except Host is forwarded. Managed policies: CachingDisabled, AllViewerExceptHostHeader.
          - PathPattern: "/v1/*"
            TargetOriginId: LDObservabilityOtelOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: false
          - PathPattern: "/observability*"
            TargetOriginId: LDObservabilityPubOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: false
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CfObservabilityPathRewrite.FunctionMetadata.FunctionARN
          - PathPattern: "/stream/eval/*"
            TargetOriginId: LDClientStreamOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['GET','HEAD','OPTIONS']
            CachedMethods: ['HEAD','GET']
            CachePolicyId: !Ref CfNoCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: false
          - PathPattern: "/sdk/eval/users/*"
            TargetOriginId: LDClientSdkOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachedMethods: ['GET','HEAD','OPTIONS']
            CachePolicyId: !Ref CfCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: true
          - PathPattern: "/eval/*"
            TargetOriginId: LDClientStreamOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['GET','HEAD','OPTIONS']
            CachedMethods: ['HEAD','GET']
            CachePolicyId: !Ref CfNoCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: false
          - PathPattern: "/sdk/evalx/*"
            TargetOriginId: LDAppOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachedMethods: ['GET','HEAD','OPTIONS']
            CachePolicyId: !Ref CfCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: true
          - PathPattern: "/events/*"
            TargetOriginId: LDEventsOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachedMethods: ['GET','HEAD','OPTIONS']
            CachePolicyId: !Ref CfCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: true
          - PathPattern: "/goals/*"
            TargetOriginId: LDClientSdkOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachedMethods: ['GET','HEAD','OPTIONS']
            CachePolicyId: !Ref CfCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: true
          - PathPattern: "/sdk/*"
            TargetOriginId: LDAppOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['DELETE','GET','HEAD','OPTIONS','PATCH','POST','PUT']
            CachedMethods: ['GET','HEAD','OPTIONS']
            CachePolicyId: !Ref CfCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: true
          - PathPattern: "/stream/*"
            TargetOriginId: LDClientStreamOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['GET','HEAD','OPTIONS']
            CachedMethods: ['HEAD','GET']
            CachePolicyId: !Ref CfNoCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: false
          - PathPattern: "/clientstream/*"
            TargetOriginId: LDClientStreamOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: ['GET','HEAD','OPTIONS']
            CachedMethods: ['HEAD','GET']
            CachePolicyId: !Ref CfNoCachePolicy
            OriginRequestPolicyId: !Ref CfOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref CfResponseHeadersPolicy
            Compress: false
        HttpVersion: http2
        IPV6Enabled: true
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref SSLCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
            MinimumProtocolVersion: TLSv1.2_2021
        Logging: !If
          - UseLogging
          - Bucket: !Sub '${LoggingBucket}.s3.amazonaws.com'
            IncludeCookies: false
            Prefix: cloudfront-logs/
          - !Ref AWS::NoValue

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: UseCustomDomain
    Properties:
      HostedZoneId: !GetAtt HostedZoneLookup.HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CfDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # AWS's hardcoded global Hosted Zone ID for ALL CloudFront distributions
        EvaluateTargetHealth: false

Outputs:
  DistributionId:
    Value: !Ref CfDistribution
    Description: CloudFront distribution ID
  DistributionDomainName:
    Value: !GetAtt CfDistribution.DomainName
    Description: CloudFront domain name
  CustomDomainName:
    Condition: UseCustomDomain
    Value: !Ref DomainName
    Description: Your custom domain name
  CertificateArn:
    Condition: UseCustomDomain
    Value: !Ref SSLCertificate
    Description: ACM certificate ARN
  HostedZoneId:
    Condition: UseCustomDomain
    Value: !GetAtt HostedZoneLookup.HostedZoneId
    Description: Route 53 hosted zone ID used
  ProxyURL:
    Value: !If
      - UseCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${CfDistribution.DomainName}'
    Description: URL to use in your LaunchDarkly SDK configuration
